name: Validate SINERGY Civilization Graph
on:
  push:
    paths: ['data/**','graph/**','schema/**','tools/validate_graph.py','.github/workflows/validate-graph.yml']
  pull_request:
    paths: ['data/**','graph/**','schema/**','tools/validate_graph.py']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_graph.py
